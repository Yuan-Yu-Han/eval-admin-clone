<div class="shell">
    <div class="topbar">
        <div style="display:flex;align-items:center;gap:12px;">
            <h1>Eval Console</h1>
            <span id="env-badge" class="tag" style="background:var(--c-blue-bg);color:var(--c-blue);font-size:12px;display:none;"></span>
            <span id="project-badge" class="tag" style="background:var(--c-green-bg);color:var(--c-green);font-size:12px;display:none;"></span>
            <select id="project-switcher" class="fi" style="display:none;width:auto;min-width:180px;padding:4px 9px;font-size:12px" onchange="switchWorkspaceProject(this.value)"></select>
            <button class="btn btn-ghost btn-sm" onclick="document.getElementById('guide-overlay').classList.add('open')" style="font-size:12px;padding:2px 10px">使用说明</button>
        </div>
        <div class="meta" id="clock"></div>
    </div>

    <div class="nav">
        <div class="nav-item active" data-tab="workspace" onclick="openWorkspaceHome()">Home</div>
        <div class="nav-item" data-tab="templates" onclick="go('templates')">Templates</div>
        <div class="nav-item" data-tab="cases" onclick="go('cases')">Cases</div>
        <div class="nav-item" data-tab="runs" onclick="go('runs')">Runs</div>
        <div class="nav-item" data-tab="mock" onclick="go('mock')">Mock</div>
        <div class="nav-item" data-tab="evaluation" onclick="go('runs')" style="display:none">Evaluation</div>
    </div>

    <!-- ══ Live banner: 有运行中任务时全局显示 ══ -->
    <div class="live-banner" id="live-banner">
        <div class="dot"></div>
        <span id="live-text">评测运行中...</span>
        <div class="prog" style="flex:1;max-width:180px;"><div class="prog-fill running" id="live-prog" style="width:0%"></div></div>
        <button class="btn btn-sm btn-r" id="live-stop" onclick="stopLiveRun()">停止</button>
        <button class="btn btn-sm btn-flat" onclick="go('runs')">查看</button>
    </div>
